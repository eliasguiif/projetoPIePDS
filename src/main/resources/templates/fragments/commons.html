<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
<meta charset="UTF-8">
<title>Security</title>
</head>
<body>

	<div id="cabecalho" class="page-header" th:fragment="cabecalho">
		<header>
			<div class="container">
				<h1>Centros de Aprendizagem - IFRN</h1>
			</div>
		</header>
	</div>

	<div id="menu" th:fragment="menu">
		<nav>
			<div class="container">
				<ul>
					<li><a th:href="@{/}">Início</a></li>

					<li sec:authorize="isAuthenticated()"><a th:href="@{/centros-aprendizagem}"> Centros de Aprendizagem </a></li>

					<li sec:authorize="hasRole('ALUNO')"><a th:href="@{/meus-atendimentos}"> Meus atendimentos </a></li>

					<li sec:authorize="hasRole('PROFESSOR')"><a
						th:href="@{/meus-cas}"> Meus CAs </a></li>

					<li sec:authorize="hasRole('PROFESSOR')"><a th:href="@{/solicitacoes}"> Solicitações </a></li>

					<li sec:authorize="hasRole('ADMIN')"><a th:href="@{/usuarios}"> Usuários </a></li>

					<li sec:authorize="hasRole('ADMIN')"><a
						th:href="@{/administrativo}"> Administração </a></li>

					<li sec:authorize="!isAuthenticated()"><a th:href="@{/login}">Login</a>
					</li>

					<li sec:authorize="isAuthenticated()"><a th:href="@{/logout}">Sair</a>
					</li>
				</ul>
			</div>
		</nav>
	</div>


	<div id="rodape" th:fragment="rodape">
		<footer class="bottom">
			<!-- 			<div class="footer-copyright"> -->
			<div class="container">
				<p>Desenvolvido por: Anderson, Elias Guilherme, Emilly Mayara e João Antônio</p>
			</div>
			<!-- 			</div> -->
		</footer>
	</div>

</body>
</html>
