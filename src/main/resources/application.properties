spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost/security_teste?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Anderson#1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.thymeleaf.render-hidden-markers-before-checkboxes=true

# Configuracao OAuth2 - SUAP
spring.security.oauth2.client.registration.suap.client-id=${SUAP_CLIENT_ID}
spring.security.oauth2.client.registration.suap.client-secret=${SUAP_CLIENT_SECRET}
spring.security.oauth2.client.registration.suap.client-name=SUAP
spring.security.oauth2.client.registration.suap.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.suap.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.suap.redirect-uri=http://localhost:8080/login/oauth2/code/suap
spring.security.oauth2.client.registration.suap.scope=identificacao

# Enderecos da API do SUAP
spring.security.oauth2.client.provider.suap.authorization-uri=https://suap.ifrn.edu.br/o/authorize/
spring.security.oauth2.client.provider.suap.token-uri=https://suap.ifrn.edu.br/o/token/
spring.security.oauth2.client.provider.suap.user-info-uri=https://suap.ifrn.edu.br/api/rh/eu/
spring.security.oauth2.client.provider.suap.user-name-attribute=identificacao

logging.level.org.springframework.security=INFO